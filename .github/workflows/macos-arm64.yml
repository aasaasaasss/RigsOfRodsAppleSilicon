# .github/workflows/macos-arm64.yml
# Rigs of Rods — macOS Apple Silicon CI Pipeline
# Target: arm64-apple-macos12.0 | OGRE 1.11.6.1 GL3Plus | Conan 2.0

name: macOS arm64 Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # Read by conan_provider.cmake during cmake configure.
  # --build=missing: compile any Conan recipe that lacks a prebuilt arm64 binary
  # -r cloudsmith:   search the Cloudsmith dependency mirror first
  CONAN_INSTALL_ARGS: "--build=missing -r cloudsmith"

jobs:
  build:
    name: Build & Package (arm64)
    runs-on: macos-14              # Apple Silicon M-series runner
    timeout-minutes: 180           # guard against from-source OGRE builds

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python isolation ──────────────────────────────────────
      # macos-14 runners use a managed Python that rejects bare pip
      # installs.  setup-python carves out an isolated environment.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── System toolchain ──────────────────────────────────────
      - name: Install system build tools
        run: brew install cmake ninja dylibbundler

      # ── Conan 2.0 ────────────────────────────────────────────
      - name: Install and configure Conan
        run: |
          pip install --upgrade pip
          pip install "conan>=2.0,<3"
          conan profile detect --force
          conan remote add cloudsmith \
            "https://dl.cloudsmith.io/public/anotherfoxguy/ror-dependencies/conan/" \
            --force
          echo "--- Conan profile ---"
          conan profile show

      # ── Apply macOS patches ───────────────────────────────────
      - name: Apply macOS arm64 patches (0001–0009)
        run: |
          echo "=== Applying macOS arm64 patch set ==="
          PATCH_COUNT=0
          for patch in patches/0*.patch; do
            [ -f "$patch" ] || continue
            echo "  Checking: $(basename "$patch")"
            git apply -p0 --check "$patch" \
              || { echo "FATAL: Patch pre-check failed: $patch"; exit 1; }
            git apply -p0 "$patch" \
              || { echo "FATAL: Patch apply failed: $patch"; exit 1; }
            echo "  ✓ Applied: $(basename "$patch")"
            PATCH_COUNT=$((PATCH_COUNT + 1))
          done
          if [ "$PATCH_COUNT" -lt 9 ]; then
            echo "FATAL: Expected 9 patches but only applied $PATCH_COUNT"
            exit 1
          fi
          echo "=== All $PATCH_COUNT patches applied successfully ==="

      # ── Conan CMake dependency provider ───────────────────────
      - name: Fetch conan_provider.cmake
        run: |
          curl -fsSL -o cmake/conan_provider.cmake \
            "https://raw.githubusercontent.com/conan-io/cmake-conan/develop2/conan_provider.cmake"
          if [ ! -s cmake/conan_provider.cmake ]; then
            echo "FATAL: conan_provider.cmake download failed or file is empty"
            exit 1
          fi
          echo "conan_provider.cmake: $(wc -c < cmake/conan_provider.cmake | tr -d ' ') bytes"

      # ── Configure ─────────────────────────────────────────────
      # conan_provider.cmake reads CONAN_INSTALL_ARGS from the env
      # and runs `conan install` automatically during cmake configure.
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      # ── Build ─────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel $(sysctl -n hw.ncpu)

      # ── Package ───────────────────────────────────────────────
      - name: Package App Bundle
        run: |
          chmod +x tools/macos/bundle.sh
          tools/macos/bundle.sh build

      # ── Upload ────────────────────────────────────────────────
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RigsOfRods-macOS-arm64
          path: build/RigsOfRods.app
          compression-level: 9
          if-no-files-found: error
