name: macOS arm64 Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CONAN_INSTALL_ARGS: "--build=missing -r cloudsmith"

jobs:
  build:
    name: Build & Package (arm64)
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system build tools
        run: |
          brew install cmake ninja dylibbundler

      - name: Install and configure Conan
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2.0,<3"

          conan profile detect --force

          # Use Cloudsmith's Conan endpoint for Conan 2.
          conan remote add cloudsmith \
            "https://conan.cloudsmith.io/anotherfoxguy/ror-dependencies/" \
            --force

          echo "--- Conan version ---"
          conan --version

          echo "--- Conan remotes ---"
          conan remote list

          echo "--- Conan profile ---"
          conan profile show

      - name: Fetch Conan CMake provider
        shell: bash
        run: |
          mkdir -p cmake

          curl --fail --show-error --silent --location \
            --retry 3 \
            --output cmake/conan_provider.cmake \
            "https://raw.githubusercontent.com/conan-io/cmake-conan/develop2/conan_provider.cmake"

          test -s cmake/conan_provider.cmake

          echo "conan_provider.cmake: $(wc -c < cmake/conan_provider.cmake | tr -d ' ') bytes"

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${GITHUB_WORKSPACE}/cmake/conan_provider.cmake" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        shell: bash
        run: |
          cmake --build build \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Package App Bundle
        shell: bash
        run: |
          chmod +x tools/macos/bundle.sh
          tools/macos/bundle.sh build

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RigsOfRods-macOS-arm64
          path: build/RigsOfRods.app
          compression-level: 9
          if-no-files-found: error
