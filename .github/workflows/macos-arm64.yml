name: macOS arm64 Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (arm64)
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system build tools
        shell: bash
        run: |
          brew install cmake ninja dylibbundler

      - name: Install Conan 1.x
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==1.66.0"
          conan --version

      - name: Setup Conan profile and remotes
        shell: bash
        run: |
          conan profile new default --detect --force
          conan remote remove conancenter || true
          conan remote add conancenter \
            "https://center.conan.io" \
            --force
          conan remote list

      - name: Install dependencies with Conan
        shell: bash
        run: |
          rm -rf build
          conan install . \
            -of build \
            --build=missing

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_POLICY_DEFAULT_CMP0048=NEW \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW

      - name: Build
        shell: bash
        run: |
          cmake --build build \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

      - name: Package App Bundle
        shell: bash
        run: |
          chmod +x tools/macos/bundle.sh
          tools/macos/bundle.sh build

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RigsOfRods-macOS-arm64
          path: build/RigsOfRods.app
          compression-level: 9
          if-no-files-found: error
